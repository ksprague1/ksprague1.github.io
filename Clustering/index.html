<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clustering — Kyle Sprague</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/styles.css" />
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a class="brand" href="../">
        <span class="brand-dot" aria-hidden="true"></span>
        <span>Kyle Sprague</span>
      </a>
      <nav class="nav-links" aria-label="Primary navigation">
        <a href="../">Home</a>
        <a href="../ml/">ML &amp; RL</a>
        <a href="../ml/replays/">Replays</a>
        <a href="../#simulations">Old Simulations</a>
        <a href="../#past-work">Past Work</a>
      </nav>
      <div class="nav-actions">
        <button id="theme-toggle" class="icon-btn" type="button">Light mode</button>
        <a class="icon-btn" href="https://github.com/ksprague1" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </header>

  <main class="sim-main">
    <div class="container">
      <div class="sim-header">
        <h1>Clustering</h1>
        <p>Interactive 2D clustering and cleaving simulation.</p>
      </div>

      <div class="sim-panel">
        <div class="slidecontainer">
          <canvas id="grid" width="512" height="512"></canvas>
          <div style="margin-top: 14px;">
            Temperature: <span id="kTtext">1.000</span><br />
            <input type="range" min="-50" max="50" value="0" class="slider" id="kT" />
            Chemical Potential: <span id="mewtext">0.000</span><br />
            <input type="range" min="-50" max="50" value="0" class="slider2" id="mew" style="width: 92%;" />
            <input type="checkbox" id="diff" /><br />
            Cell Updates Per Frame: <span id="stepstext">10 x</span> (<span id="stepmeter">0</span>)<br />
            <input type="range" min="-7" max="4" value="-7" class="slider" id="steps" />

            <button type="button" class="collapsible">Advanced</button>
            <div class="content">
              Proposal Temp: <span id="cstext">Unknown</span><br />
              <div class="range-slider_flat">
                <input type="range" min="0" max="100" value="100" class="multislider first" id="r1" />
                <input type="range" min="0" max="100" value="100" class="multislider second" id="r2" />
              </div>
              Max Cluster Size: <span id="Ntext">Any</span><br />
              <input type="range" min="0" max="2000" value="0" class="slider" id="N" />
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="../assets/app.js"></script>
  <script defer src="cleaving.js"></script>
  <script>
    var coll = document.getElementsByClassName("collapsible");
    for (var i = 0; i < coll.length; i++) {
      coll[i].addEventListener("click", function () {
        this.classList.toggle("active");
        var content = this.nextElementSibling;
        content.style.display = content.style.display === "block" ? "none" : "block";
      });
    }
  </script>
</body>
</html>
