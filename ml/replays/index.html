<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RLBalatro Replays — Kyle Sprague</title>
  <meta name="description" content="RLBalatro replay videos with Ante/Blind jump controls and synchronized decision play-by-play." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/styles.css" />
  <style>
    .replay-top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 18px;
    }
    .replay-selectors {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .replay-select {
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
    }
    .replay-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(300px, 1fr);
      gap: 18px;
      align-items: start;
    }
    .video-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .player-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    .player-stage video,
    .player-stage iframe,
    .player-stage #yt-player {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
    }
    .player-empty {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      color: var(--text-muted);
      font-size: 0.92rem;
      gap: 8px;
    }
    .player-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }
    .chapter-box {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .chapter-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .chapter-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .chap-btn {
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      cursor: pointer;
      transition: all 0.12s ease;
    }
    .chap-btn:hover {
      border-color: var(--border-strong);
      color: var(--text);
    }
    .chap-btn.boss {
      border-color: rgba(245, 158, 11, 0.35);
    }
    .chap-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .pbp-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      height: 640px;
    }
    .pbp-status {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 10px;
      border-radius: var(--radius-sm);
      background: var(--bg);
      border: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      margin-bottom: 10px;
    }
    .pbp-status span {
      color: var(--text-muted);
    }
    .pbp-status strong {
      color: var(--text);
    }
    .pbp-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .pbp-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-right: 4px;
    }
    .pbp-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 9px;
      border-radius: 6px;
      border: 1px solid transparent;
      background: var(--bg);
      font-size: 0.8rem;
      cursor: pointer;
      text-align: left;
      width: 100%;
      color: var(--text);
      font-family: var(--font-sans);
    }
    .pbp-row:hover {
      border-color: var(--border-strong);
      background: var(--bg-hover);
    }
    .pbp-row.active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .pbp-left {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
    }
    .pbp-time {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-dim);
      flex-shrink: 0;
    }
    .pbp-action {
      font-family: var(--font-mono);
      font-size: 0.76rem;
      font-weight: 600;
      word-break: break-word;
    }
    .pbp-right {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .pbp-scored {
      color: var(--gold);
      font-weight: 600;
    }
    @media (max-width: 960px) {
      .replay-layout {
        grid-template-columns: 1fr;
      }
      .pbp-card {
        height: 460px;
      }
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a class="brand" href="../../">
        <span class="brand-dot" aria-hidden="true"></span>
        <span>Kyle Sprague</span>
      </a>
      <nav class="nav-links" aria-label="Primary navigation">
        <a href="../../">Home</a>
        <a href="../">ML &amp; RL</a>
        <a href="./">Replays</a>
        <a href="../../#simulations">Old Simulations</a>
        <a href="../../#past-work">Past Work</a>
      </nav>
      <div class="nav-actions">
        <button id="theme-toggle" class="icon-btn" type="button">Light mode</button>
        <a class="icon-btn" href="https://github.com/ksprague1" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </header>

  <main class="sim-main">
    <div class="container">
      <div class="replay-top">
        <div>
          <h1 style="margin: 0 0 4px; font-size: clamp(1.5rem, 2.5vw, 2rem);">RLBalatro Replays</h1>
          <p id="run-summary" style="margin: 0; color: var(--text-muted); font-size: 0.94rem;"></p>
        </div>
        <div class="replay-selectors">
          <select id="deck-select" class="replay-select" aria-label="Select deck"></select>
          <select id="stake-select" class="replay-select" aria-label="Select stake"></select>
          <div class="btn-group" role="group" aria-label="Select run pick">
            <button class="seg-btn" type="button" data-pick="best">Best</button>
            <button class="seg-btn" type="button" data-pick="median">Median</button>
            <button class="seg-btn" type="button" data-pick="worst">Worst</button>
          </div>
        </div>
      </div>

      <div class="replay-layout">
        <div class="video-card">
          <div class="player-stage">
            <video id="replay-video" controls preload="metadata" playsinline style="display: none;"></video>
            <div id="yt-container" style="display: none; width: 100%; height: 100%;">
              <div id="yt-player"></div>
            </div>
            <div id="player-empty" class="player-empty" style="display: none;"></div>
          </div>

          <div class="player-controls">
            <div style="display: flex; gap: 8px;">
              <button class="icon-btn" type="button" id="prev-blind">&larr; Prev Blind</button>
              <button class="icon-btn" type="button" id="next-blind">Next Blind &rarr;</button>
            </div>
            <div class="btn-group" role="group" aria-label="Playback speed">
              <button class="seg-btn active" type="button" data-speed="1">1x</button>
              <button class="seg-btn" type="button" data-speed="1.5">1.5x</button>
              <button class="seg-btn" type="button" data-speed="2">2x</button>
              <button class="seg-btn" type="button" data-speed="4" id="speed-4x">4x</button>
            </div>
          </div>

          <div class="chapter-box">
            <div class="chapter-title">Jump to Ante / Blind (yellow border = Boss Blind)</div>
            <div id="chapter-grid" class="chapter-grid"></div>
          </div>
        </div>

        <aside class="pbp-card">
          <div class="pbp-status" id="pbp-status">
            <div><span>Ante:</span> <strong id="st-ante">1</strong></div>
            <div><span>Round:</span> <strong id="st-round">0</strong></div>
            <div><span>Cash:</span> <strong id="st-money">$0</strong></div>
            <div><span>Chips:</span> <strong id="st-chips">0 / 0</strong></div>
            <div><span>Hands:</span> <strong id="st-hands">4</strong></div>
            <div><span>Discards:</span> <strong id="st-discards">2</strong></div>
          </div>

          <div class="pbp-toolbar">
            <strong>Decision Play-by-Play</strong>
            <label style="display: inline-flex; align-items: center; gap: 6px; cursor: pointer;">
              <input type="checkbox" id="toggle-reorders" />
              Show card/joker moves
            </label>
          </div>

          <div id="pbp-list" class="pbp-list"></div>
        </aside>
      </div>
    </div>
  </main>

  <script src="../../assets/app.js"></script>
  <script src="manifest.js"></script>
  <script src="youtube_ids.js"></script>
  <script>
    (function () {
      const DECK_NAMES = {
        b_red: "Red Deck",
        b_blue: "Blue Deck",
        b_yellow: "Yellow Deck",
        b_green: "Green Deck",
        b_black: "Black Deck",
        b_magic: "Magic Deck",
        b_nebula: "Nebula Deck",
        b_ghost: "Ghost Deck",
        b_abandoned: "Abandoned Deck",
        b_checkered: "Checkered Deck",
        b_zodiac: "Zodiac Deck",
        b_painted: "Painted Deck",
        b_anaglyph: "Anaglyph Deck",
        b_plasma: "Plasma Deck",
        b_erratic: "Erratic Deck",
      };
      const STAKE_NAMES = {
        1: "White (1)",
        2: "Red (2)",
        3: "Green (3)",
        4: "Black (4)",
        5: "Blue (5)",
        6: "Purple (6)",
        7: "Orange (7)",
        8: "Gold (8)",
      };

      const manifest = window.REPLAY_MANIFEST || {};
      const ytIds = window.YOUTUBE_IDS || {};

      const deckSelect = document.getElementById("deck-select");
      const stakeSelect = document.getElementById("stake-select");
      const video = document.getElementById("replay-video");
      const ytContainer = document.getElementById("yt-container");
      const playerEmpty = document.getElementById("player-empty");
      const summaryEl = document.getElementById("run-summary");
      const chapterGrid = document.getElementById("chapter-grid");
      const pbpList = document.getElementById("pbp-list");
      const toggleReorders = document.getElementById("toggle-reorders");
      const speed4xBtn = document.getElementById("speed-4x");

      Object.entries(DECK_NAMES).forEach(([k, name]) => {
        const opt = document.createElement("option");
        opt.value = k;
        opt.textContent = name;
        deckSelect.appendChild(opt);
      });
      Object.entries(STAKE_NAMES).forEach(([k, name]) => {
        const opt = document.createElement("option");
        opt.value = k;
        opt.textContent = name;
        stakeSelect.appendChild(opt);
      });

      const params = new URLSearchParams(window.location.search);
      let currentDeck = DECK_NAMES[params.get("deck")] ? params.get("deck") : "b_yellow";
      let currentStake = STAKE_NAMES[params.get("stake")] ? Number(params.get("stake")) : 8;
      let currentPick = ["best", "median", "worst"].includes(params.get("pick")) ? params.get("pick") : "best";

      let currentData = null;
      let visibleEvents = [];
      let activeEventIdx = -1;
      let activeChapterIdx = -1;
      let pendingSeek = null;

      // Player mode: "mp4" | "yt" | "none"
      let playerMode = "none";
      let ytPlayer = null;
      let ytReady = false;
      let ytApiLoading = false;
      let ytPollTimer = null;
      let pendingYtVideoId = null;

      function ensureYtApi(onReady) {
        if (window.YT && window.YT.Player) {
          onReady();
          return;
        }
        window.onYouTubeIframeAPIReady = onReady;
        if (!ytApiLoading) {
          ytApiLoading = true;
          const tag = document.createElement("script");
          tag.src = "https://www.youtube.com/iframe_api";
          document.head.appendChild(tag);
        }
      }

      function startYtPoll() {
        stopYtPoll();
        ytPollTimer = setInterval(() => {
          if (playerMode === "yt" && ytPlayer && ytReady && typeof ytPlayer.getCurrentTime === "function") {
            syncToTime(ytPlayer.getCurrentTime());
          }
        }, 200);
      }

      function stopYtPoll() {
        if (ytPollTimer) {
          clearInterval(ytPollTimer);
          ytPollTimer = null;
        }
      }

      function fmtTime(sec) {
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return m + ":" + String(s).padStart(2, "0");
      }

      function fmtChips(n) {
        if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
        if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
        return String(n);
      }

      function getSpeed() {
        return Number(document.querySelector("[data-speed].active")?.getAttribute("data-speed") || 1);
      }

      function applySpeed(spd) {
        if (playerMode === "mp4") {
          video.playbackRate = spd;
        } else if (playerMode === "yt" && ytPlayer && ytReady) {
          ytPlayer.setPlaybackRate(Math.min(2, spd));
        }
      }

      function seekTo(t) {
        if (playerMode === "yt") {
          if (ytPlayer && ytReady) {
            ytPlayer.seekTo(t, true);
            ytPlayer.playVideo();
          } else {
            pendingSeek = t;
          }
          syncToTime(t);
          return;
        }
        if (playerMode === "mp4") {
          if (video.readyState < 1) {
            pendingSeek = t;
            video.load();
            return;
          }
          pendingSeek = null;
          video.currentTime = t;
          if (video.paused) video.play().catch(() => {});
          syncToTime(t);
          return;
        }
        syncToTime(t);
      }

      video.addEventListener("loadedmetadata", () => {
        if (pendingSeek !== null && playerMode === "mp4") {
          const t = pendingSeek;
          pendingSeek = null;
          video.currentTime = t;
          video.play().catch(() => {});
          syncToTime(t);
        }
      });

      video.addEventListener("timeupdate", () => {
        if (playerMode === "mp4") syncToTime(video.currentTime);
      });

      function renderChapters() {
        chapterGrid.innerHTML = "";
        if (!currentData) return;
        currentData.chapters.forEach((ch) => {
          const btn = document.createElement("button");
          btn.type = "button";
          const isBoss = ch.round % 3 === 0;
          btn.className = "chap-btn" + (isBoss ? " boss" : "");
          btn.textContent = `A${ch.ante}·R${ch.round}`;
          btn.title = `Ante ${ch.ante}, Round ${ch.round} (Target: ${ch.req.toLocaleString()} chips) @ ${fmtTime(ch.t)}`;
          btn.addEventListener("click", () => seekTo(ch.t));
          chapterGrid.appendChild(btn);
        });
      }

      function renderPlayByPlay() {
        pbpList.innerHTML = "";
        activeEventIdx = -1;
        if (!currentData) return;
        const showReorders = toggleReorders.checked;
        visibleEvents = currentData.events.filter((e) => showReorders || !e.reorder);

        visibleEvents.forEach((ev) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "pbp-row";
          const rightHtml = ev.scored
            ? `<span class="pbp-scored">+${fmtChips(ev.scored)}</span>`
            : `<span>A${ev.ante} R${ev.round}</span>`;
          btn.innerHTML = `
            <span class="pbp-left">
              <span class="pbp-time">${fmtTime(ev.t)}</span>
              <span class="pbp-action">${ev.action}</span>
            </span>
            <span class="pbp-right">${rightHtml}</span>
          `;
          btn.addEventListener("click", () => seekTo(ev.t));
          pbpList.appendChild(btn);
        });
      }

      function updateStatus(ev) {
        if (!ev) return;
        document.getElementById("st-ante").textContent = ev.ante;
        document.getElementById("st-round").textContent = ev.round;
        document.getElementById("st-money").textContent = "$" + ev.money;
        document.getElementById("st-chips").textContent = fmtChips(ev.chips) + " / " + fmtChips(ev.req);
        document.getElementById("st-hands").textContent = ev.hands;
        document.getElementById("st-discards").textContent = ev.discards;
      }

      function syncToTime(t) {
        if (!currentData) return;
        let cIdx = 0;
        for (let i = 0; i < currentData.chapters.length; i++) {
          if (currentData.chapters[i].t <= t + 0.05) cIdx = i;
          else break;
        }
        if (cIdx !== activeChapterIdx) {
          const btns = chapterGrid.children;
          if (activeChapterIdx >= 0 && btns[activeChapterIdx]) btns[activeChapterIdx].classList.remove("active");
          if (btns[cIdx]) btns[cIdx].classList.add("active");
          activeChapterIdx = cIdx;
        }

        let eIdx = 0;
        for (let i = 0; i < visibleEvents.length; i++) {
          if (visibleEvents[i].t <= t + 0.05) eIdx = i;
          else break;
        }
        if (eIdx !== activeEventIdx) {
          const rows = pbpList.children;
          if (activeEventIdx >= 0 && rows[activeEventIdx]) rows[activeEventIdx].classList.remove("active");
          if (rows[eIdx]) {
            rows[eIdx].classList.add("active");
            rows[eIdx].scrollIntoView({ block: "nearest" });
          }
          activeEventIdx = eIdx;
          updateStatus(visibleEvents[eIdx]);
        }
      }

      function showVideoSource(runKey, meta) {
        const ytId = ytIds[runKey];
        video.pause();
        stopYtPoll();

        if (ytId) {
          playerMode = "yt";
          video.style.display = "none";
          playerEmpty.style.display = "none";
          ytContainer.style.display = "block";
          if (speed4xBtn) speed4xBtn.style.display = "none";

          ensureYtApi(() => {
            if (ytPlayer && ytReady) {
              ytPlayer.loadVideoById(ytId);
              applySpeed(getSpeed());
              startYtPoll();
            } else {
              pendingYtVideoId = ytId;
              ytPlayer = new YT.Player("yt-player", {
                videoId: ytId,
                playerVars: { rel: 0, modestbranding: 1 },
                events: {
                  onReady: () => {
                    ytReady = true;
                    applySpeed(getSpeed());
                    startYtPoll();
                    if (pendingSeek !== null) {
                      const t = pendingSeek;
                      pendingSeek = null;
                      ytPlayer.seekTo(t, true);
                    }
                  },
                },
              });
            }
          });
        } else if (meta && meta.local) {
          playerMode = "mp4";
          ytContainer.style.display = "none";
          playerEmpty.style.display = "none";
          video.style.display = "block";
          if (speed4xBtn) speed4xBtn.style.display = "";
          video.src = `videos/${runKey}.mp4`;
          video.playbackRate = getSpeed();
        } else {
          playerMode = "none";
          video.style.display = "none";
          ytContainer.style.display = "none";
          playerEmpty.style.display = "flex";
          if (speed4xBtn) speed4xBtn.style.display = "";
          playerEmpty.innerHTML = meta
            ? `<strong>No video uploaded yet for <code>${runKey}</code></strong><span>Add its unlisted YouTube ID to <code>ml/replays/youtube_ids.js</code>. Play-by-play is still available on the right.</span>`
            : `<strong>No replay recorded for ${DECK_NAMES[currentDeck]} · ${STAKE_NAMES[currentStake]} (${currentPick})</strong><span>Try another pick or deck/stake above.</span>`;
        }
      }

      async function loadSelection() {
        deckSelect.value = currentDeck;
        stakeSelect.value = String(currentStake);

        // Update pick button availability
        const availablePicks = ["best", "median", "worst"].filter(
          (p) => manifest[`${currentDeck}_s${currentStake}_${p}`]
        );
        if (availablePicks.length && !availablePicks.includes(currentPick)) {
          currentPick = availablePicks[0];
        }

        document.querySelectorAll("[data-pick]").forEach((btn) => {
          const p = btn.getAttribute("data-pick");
          btn.classList.toggle("active", p === currentPick);
          btn.disabled = !manifest[`${currentDeck}_s${currentStake}_${p}`];
          btn.style.opacity = btn.disabled ? "0.4" : "1";
        });

        const url = new URL(window.location.href);
        url.searchParams.set("deck", currentDeck);
        url.searchParams.set("stake", String(currentStake));
        url.searchParams.set("pick", currentPick);
        window.history.replaceState({}, "", url);

        const runKey = `${currentDeck}_s${currentStake}_${currentPick}`;
        const meta = manifest[runKey];

        if (meta) {
          const outcome = meta.won ? `Won Ante 8, reached Ante ${meta.ante}` : `Ended Ante ${meta.ante}`;
          summaryEl.textContent = `${DECK_NAMES[currentDeck]} · ${STAKE_NAMES[currentStake]} Stake (${currentPick}) — ${outcome} (${fmtChips(meta.chips)} / ${fmtChips(meta.req)} chips, ${meta.blinds} blinds beaten).`;
        } else {
          summaryEl.textContent = `${DECK_NAMES[currentDeck]} · ${STAKE_NAMES[currentStake]} Stake — no recorded replay in this set yet.`;
        }

        showVideoSource(runKey, meta);

        activeChapterIdx = -1;
        activeEventIdx = -1;
        currentData = null;
        renderChapters();
        renderPlayByPlay();

        if (meta) {
          try {
            const resp = await fetch(`runs/${runKey}.json`);
            if (resp.ok) {
              currentData = await resp.json();
              renderChapters();
              renderPlayByPlay();
              syncToTime(0);
            }
          } catch (err) {
            console.error("Failed to load run JSON:", err);
          }
        }
      }

      deckSelect.addEventListener("change", () => {
        currentDeck = deckSelect.value;
        loadSelection();
      });

      stakeSelect.addEventListener("change", () => {
        currentStake = Number(stakeSelect.value);
        loadSelection();
      });

      document.querySelectorAll("[data-pick]").forEach((btn) => {
        btn.addEventListener("click", () => {
          if (btn.disabled) return;
          currentPick = btn.getAttribute("data-pick");
          loadSelection();
        });
      });

      toggleReorders.addEventListener("change", () => {
        renderPlayByPlay();
        if (playerMode === "mp4") syncToTime(video.currentTime);
        else if (playerMode === "yt" && ytPlayer && ytReady) syncToTime(ytPlayer.getCurrentTime());
      });

      document.getElementById("prev-blind").addEventListener("click", () => {
        if (!currentData) return;
        const next = Math.max(0, activeChapterIdx - 1);
        if (currentData.chapters[next]) seekTo(currentData.chapters[next].t);
      });

      document.getElementById("next-blind").addEventListener("click", () => {
        if (!currentData) return;
        const next = Math.min(currentData.chapters.length - 1, activeChapterIdx + 1);
        if (currentData.chapters[next]) seekTo(currentData.chapters[next].t);
      });

      document.querySelectorAll("[data-speed]").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll("[data-speed]").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          applySpeed(Number(btn.getAttribute("data-speed")));
        });
      });

      loadSelection();
    })();
  </script>
</body>
</html>
