<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RLBalatro Replays — Kyle Sprague</title>
  <meta name="description" content="Gold Stake Yellow Deck replay videos with Ante/Blind jump controls and synchronized decision play-by-play." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/styles.css" />
  <style>
    .replay-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
    }
    .replay-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(300px, 1fr);
      gap: 18px;
      align-items: start;
    }
    .video-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .video-card video {
      width: 100%;
      border-radius: var(--radius-sm);
      background: #000;
      display: block;
    }
    .player-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }
    .chapter-box {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .chapter-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .chapter-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .chap-btn {
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      cursor: pointer;
      transition: all 0.12s ease;
    }
    .chap-btn:hover {
      border-color: var(--border-strong);
      color: var(--text);
    }
    .chap-btn.boss {
      border-color: rgba(245, 158, 11, 0.35);
    }
    .chap-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .pbp-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      height: 640px;
    }
    .pbp-status {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 10px;
      border-radius: var(--radius-sm);
      background: var(--bg);
      border: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      margin-bottom: 10px;
    }
    .pbp-status span {
      color: var(--text-muted);
    }
    .pbp-status strong {
      color: var(--text);
    }
    .pbp-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .pbp-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-right: 4px;
    }
    .pbp-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 9px;
      border-radius: 6px;
      border: 1px solid transparent;
      background: var(--bg);
      font-size: 0.8rem;
      cursor: pointer;
      text-align: left;
      width: 100%;
      color: var(--text);
      font-family: var(--font-sans);
    }
    .pbp-row:hover {
      border-color: var(--border-strong);
      background: var(--bg-hover);
    }
    .pbp-row.active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .pbp-left {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
    }
    .pbp-time {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-dim);
      flex-shrink: 0;
    }
    .pbp-action {
      font-family: var(--font-mono);
      font-size: 0.76rem;
      font-weight: 600;
      word-break: break-word;
    }
    .pbp-right {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .pbp-scored {
      color: var(--gold);
      font-weight: 600;
    }
    @media (max-width: 960px) {
      .replay-layout {
        grid-template-columns: 1fr;
      }
      .pbp-card {
        height: 460px;
      }
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a class="brand" href="../../">
        <span class="brand-dot" aria-hidden="true"></span>
        <span>Kyle Sprague</span>
      </a>
      <nav class="nav-links" aria-label="Primary navigation">
        <a href="../../">Home</a>
        <a href="../">ML &amp; RL</a>
        <a href="./">Replays</a>
        <a href="../../#simulations">Old Simulations</a>
        <a href="../../#past-work">Past Work</a>
      </nav>
      <div class="nav-actions">
        <button id="theme-toggle" class="icon-btn" type="button">Light mode</button>
        <a class="icon-btn" href="https://github.com/ksprague1" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </header>

  <main class="sim-main">
    <div class="container">
      <div class="replay-top">
        <div>
          <h1 style="margin: 0 0 4px; font-size: clamp(1.5rem, 2.5vw, 2rem);">RLBalatro Gold Stake Replays</h1>
          <p id="run-summary" style="margin: 0; color: var(--text-muted); font-size: 0.94rem;"></p>
        </div>
        <div class="btn-group" role="group" aria-label="Select replay">
          <button class="seg-btn active" type="button" data-run="best">Best Run (Ante 11)</button>
          <button class="seg-btn" type="button" data-run="median">Median Run (Ante 8 Boss)</button>
        </div>
      </div>

      <div class="replay-layout">
        <div class="video-card">
          <video id="replay-video" controls preload="metadata" playsinline></video>

          <div class="player-controls">
            <div style="display: flex; gap: 8px;">
              <button class="icon-btn" type="button" id="prev-blind">&larr; Prev Blind</button>
              <button class="icon-btn" type="button" id="next-blind">Next Blind &rarr;</button>
            </div>
            <div class="btn-group" role="group" aria-label="Playback speed">
              <button class="seg-btn active" type="button" data-speed="1">1x</button>
              <button class="seg-btn" type="button" data-speed="1.5">1.5x</button>
              <button class="seg-btn" type="button" data-speed="2">2x</button>
              <button class="seg-btn" type="button" data-speed="4">4x</button>
            </div>
          </div>

          <div class="chapter-box">
            <div class="chapter-title">Jump to Ante / Blind (yellow border = Boss Blind)</div>
            <div id="chapter-grid" class="chapter-grid"></div>
          </div>
        </div>

        <aside class="pbp-card">
          <div class="pbp-status" id="pbp-status">
            <div><span>Ante:</span> <strong id="st-ante">1</strong></div>
            <div><span>Round:</span> <strong id="st-round">0</strong></div>
            <div><span>Cash:</span> <strong id="st-money">$14</strong></div>
            <div><span>Chips:</span> <strong id="st-chips">0 / 0</strong></div>
            <div><span>Hands:</span> <strong id="st-hands">4</strong></div>
            <div><span>Discards:</span> <strong id="st-discards">2</strong></div>
          </div>

          <div class="pbp-toolbar">
            <strong>Decision Play-by-Play</strong>
            <label style="display: inline-flex; align-items: center; gap: 6px; cursor: pointer;">
              <input type="checkbox" id="toggle-reorders" />
              Show card/joker moves
            </label>
          </div>

          <div id="pbp-list" class="pbp-list"></div>
        </aside>
      </div>
    </div>
  </main>

  <script src="../../assets/app.js"></script>
  <script src="data.js"></script>
  <script>
    (function () {
      const RUN_INFO = {
        best: {
          src: "videos/b_yellow_s8_best.mp4",
          summary: "Yellow Deck · Gold Stake (Stake 8) — Wins Ante 8 and reaches Endless Ante 11 (50.6M / 58M chips, 38 blinds beaten).",
        },
        median: {
          src: "videos/b_yellow_s8_median.mp4",
          summary: "Yellow Deck · Gold Stake (Stake 8) — Loses on the Ante 8 Boss Blind with 993k / 1.2M chips after beating 23 blinds.",
        },
      };

      const video = document.getElementById("replay-video");
      const summaryEl = document.getElementById("run-summary");
      const chapterGrid = document.getElementById("chapter-grid");
      const pbpList = document.getElementById("pbp-list");
      const toggleReorders = document.getElementById("toggle-reorders");

      let currentRunKey = "best";
      let currentData = window.REPLAY_DATA.best;
      let visibleEvents = [];
      let activeEventIdx = -1;
      let activeChapterIdx = -1;

      function fmtTime(sec) {
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return m + ":" + String(s).padStart(2, "0");
      }

      function fmtChips(n) {
        if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
        if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
        return String(n);
      }

      let pendingSeek = null;

      function seekTo(t) {
        if (video.readyState < 1) {
          pendingSeek = t;
          video.load();
          return;
        }
        pendingSeek = null;
        video.currentTime = t;
        if (video.paused) {
          video.play().catch(() => {});
        }
        syncToTime(t);
      }

      video.addEventListener("loadedmetadata", () => {
        if (pendingSeek !== null) {
          const t = pendingSeek;
          pendingSeek = null;
          video.currentTime = t;
          video.play().catch(() => {});
          syncToTime(t);
        }
      });

      function renderChapters() {
        chapterGrid.innerHTML = "";
        currentData.chapters.forEach((ch, idx) => {
          const btn = document.createElement("button");
          btn.type = "button";
          const isBoss = ch.round % 3 === 0;
          btn.className = "chap-btn" + (isBoss ? " boss" : "");
          btn.textContent = `A${ch.ante}·R${ch.round}`;
          btn.title = `Ante ${ch.ante}, Round ${ch.round} (Target: ${ch.req.toLocaleString()} chips) @ ${fmtTime(ch.t)}`;
          btn.addEventListener("click", () => seekTo(ch.t));
          chapterGrid.appendChild(btn);
        });
      }

      function renderPlayByPlay() {
        const showReorders = toggleReorders.checked;
        visibleEvents = currentData.events.filter((e) => showReorders || !e.reorder);
        pbpList.innerHTML = "";
        activeEventIdx = -1;

        visibleEvents.forEach((ev, idx) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "pbp-row";
          const rightHtml = ev.scored
            ? `<span class="pbp-scored">+${fmtChips(ev.scored)}</span>`
            : `<span>A${ev.ante} R${ev.round}</span>`;
          btn.innerHTML = `
            <span class="pbp-left">
              <span class="pbp-time">${fmtTime(ev.t)}</span>
              <span class="pbp-action">${ev.action}</span>
            </span>
            <span class="pbp-right">${rightHtml}</span>
          `;
          btn.addEventListener("click", () => seekTo(ev.t));
          pbpList.appendChild(btn);
        });
      }

      function updateStatus(ev) {
        if (!ev) return;
        document.getElementById("st-ante").textContent = ev.ante;
        document.getElementById("st-round").textContent = ev.round;
        document.getElementById("st-money").textContent = "$" + ev.money;
        document.getElementById("st-chips").textContent = fmtChips(ev.chips) + " / " + fmtChips(ev.req);
        document.getElementById("st-hands").textContent = ev.hands;
        document.getElementById("st-discards").textContent = ev.discards;
      }

      function syncToTime(t) {
        // Find latest chapter <= t + 0.05
        let cIdx = 0;
        for (let i = 0; i < currentData.chapters.length; i++) {
          if (currentData.chapters[i].t <= t + 0.05) cIdx = i;
          else break;
        }
        if (cIdx !== activeChapterIdx) {
          const btns = chapterGrid.children;
          if (activeChapterIdx >= 0 && btns[activeChapterIdx]) btns[activeChapterIdx].classList.remove("active");
          if (btns[cIdx]) btns[cIdx].classList.add("active");
          activeChapterIdx = cIdx;
        }

        // Find latest visible event <= t + 0.05
        let eIdx = 0;
        for (let i = 0; i < visibleEvents.length; i++) {
          if (visibleEvents[i].t <= t + 0.05) eIdx = i;
          else break;
        }
        if (eIdx !== activeEventIdx) {
          const rows = pbpList.children;
          if (activeEventIdx >= 0 && rows[activeEventIdx]) rows[activeEventIdx].classList.remove("active");
          if (rows[eIdx]) {
            rows[eIdx].classList.add("active");
            rows[eIdx].scrollIntoView({ block: "nearest" });
          }
          activeEventIdx = eIdx;
          updateStatus(visibleEvents[eIdx]);
        }
      }

      function loadRun(key) {
        currentRunKey = key;
        currentData = window.REPLAY_DATA[key];
        summaryEl.textContent = RUN_INFO[key].summary;
        const speed = Number(document.querySelector("[data-speed].active")?.getAttribute("data-speed") || 1);
        video.src = RUN_INFO[key].src;
        video.playbackRate = speed;
        activeChapterIdx = -1;
        activeEventIdx = -1;
        renderChapters();
        renderPlayByPlay();
        syncToTime(0);
      }

      video.addEventListener("timeupdate", () => syncToTime(video.currentTime));
      toggleReorders.addEventListener("change", () => {
        renderPlayByPlay();
        syncToTime(video.currentTime);
      });

      document.getElementById("prev-blind").addEventListener("click", () => {
        const next = Math.max(0, activeChapterIdx - 1);
        if (currentData.chapters[next]) seekTo(currentData.chapters[next].t);
      });
      document.getElementById("next-blind").addEventListener("click", () => {
        const next = Math.min(currentData.chapters.length - 1, activeChapterIdx + 1);
        if (currentData.chapters[next]) seekTo(currentData.chapters[next].t);
      });

      document.querySelectorAll("[data-run]").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll("[data-run]").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          loadRun(btn.getAttribute("data-run"));
        });
      });

      document.querySelectorAll("[data-speed]").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll("[data-speed]").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          video.playbackRate = Number(btn.getAttribute("data-speed"));
        });
      });

      loadRun("best");
    })();
  </script>
</body>
</html>
