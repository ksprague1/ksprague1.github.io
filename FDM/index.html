<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fluid Dynamics (FDM) — Kyle Sprague</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/styles.css" />
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a class="brand" href="../">
        <span class="brand-dot" aria-hidden="true"></span>
        <span>Kyle Sprague</span>
      </a>
      <nav class="nav-links" aria-label="Primary navigation">
        <a href="../">Home</a>
        <a href="../ml/">ML &amp; RL</a>
        <a href="../ml/replays/">Replays</a>
        <a href="../#simulations">Old Simulations</a>
        <a href="../#past-work">Past Work</a>
      </nav>
      <div class="nav-actions">
        <button id="theme-toggle" class="icon-btn" type="button">Light mode</button>
        <a class="icon-btn" href="https://github.com/ksprague1" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </header>

  <main class="sim-main">
    <div class="container">
      <div class="sim-header">
        <h1>Fluid Dynamics (FDM)</h1>
        <p>Finite difference method 2D fluid simulation running on the GPU.</p>
      </div>

      <div class="sim-panel">
        <div class="canvascontainer">
          <canvas id="grid" width="512" height="512"></canvas>
          <canvas id="Volts" width="512" height="512"></canvas>
        </div>
        <div class="slidecontainer">
          Temperature: <span id="kTtext">2.269</span><br />
          <input type="range" min="-50" max="50" value="0" class="slider" id="kT" />
          Field Strength: <span id="mewtext">0.00000</span><br />
          <input type="range" min="-50" max="50" value="0" class="slider" id="mew" />
          Cell Updates Per Frame: <span id="stepstext">10 x</span> (<span id="stepmeter">0</span>)<br />
          <input type="range" min="-1" max="8" value="-1" class="slider" id="steps" />
          Plot Voltage: <input type="checkbox" id="PlotV" /><br />
          <button type="button" id="stopbutton"><span id="stoptext">Start</span></button>
        </div>
      </div>
    </div>
  </main>

  <script src="../assets/app.js"></script>
  <script src="dist/gpu-browser.min.js"></script>
  <script defer src="FDM.js"></script>
</body>
</html>
